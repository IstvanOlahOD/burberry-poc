name: Pre-warm render cache

# Vercel's CDN cache is per-deployment, so each production deploy starts cold and
# the first visitor pays the ~830ms upstream render on every frame. This warms the
# edge automatically once a production deploy reports success, and can also be run
# by hand from the Actions tab — pick `variants` there for the one-time job that
# fills the durable store.
#
# `deployment_status` fires for previews and for failed builds too, which is what
# the job's `if:` guard filters.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      scope:
        description: "deploy (landing config) or variants (all filter combinations, one-time)"
        type: choice
        default: deploy
        options: [deploy, variants]

jobs:
  prewarm:
    # A manual run always proceeds; an automatic one only for a production deploy
    # that actually succeeded, so preview builds and failures do not warm.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    # The variants scope walks thousands of URLs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Warms the production alias rather than the deployment URL: cache keys
      # include the host, and the alias is what visitors actually hit.
      - name: Warm the cache
        env:
          SCOPE: ${{ github.event.inputs.scope || 'deploy' }}
        run: node scripts/prewarm.mjs https://burberry-poc.vercel.app "$SCOPE"
