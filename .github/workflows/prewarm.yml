name: Pre-warm render cache

# DISABLED: automatic warming after a deploy is off.
#
# Vercel's CDN cache is per-deployment, so each production deploy starts cold and
# the first visitor pays the upstream render. This workflow warms it — but only
# when started by hand, from the Actions tab.
#
# To re-enable automatic warming, add `deployment_status:` back under `on:` and
# restore the event guard in the job's `if:` (both kept below, commented out).
# Nothing else needs changing; the script and /api/prewarm remain functional.
on:
  # deployment_status:
  workflow_dispatch:
    inputs:
      scope:
        description: "deploy (landing config) or variants (all filter combinations, one-time)"
        type: choice
        default: deploy
        options: [deploy, variants]

jobs:
  prewarm:
    # Only manual runs reach this job while the deploy trigger is off. With
    # `deployment_status` re-enabled, restore the guard so that only a
    # successful production deploy warms:
    #
    # if: >-
    #   github.event_name == 'workflow_dispatch' ||
    #   (github.event.deployment_status.state == 'success' &&
    #    github.event.deployment_status.environment == 'Production')
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The variants scope walks thousands of URLs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Warms the production alias rather than the deployment URL: cache keys
      # include the host, and the alias is what visitors actually hit.
      - name: Warm the cache
        env:
          SCOPE: ${{ github.event.inputs.scope || 'deploy' }}
        run: node scripts/prewarm.mjs https://burberry-poc.vercel.app "$SCOPE"
